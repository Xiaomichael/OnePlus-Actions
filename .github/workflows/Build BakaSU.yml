name: Build BakaSU
on:
  workflow_dispatch:
    inputs:
    
      CPU:
        description: "CPU分支"
        required: true
        type: choice
        options:
          - 'sm8750'
          - 'sm8735'
          - 'mt6991'
          - 'sm8650'
          - 'mt6989'
          - 'sm8635'
          - 'sm8550'
          - 'sm8450'
          - 'sm8475'
          - 'sm7675'
          - 'sm7635'
          - 'sm7550'
          - 'sm6375'
        default: 'sm8650'
        
      FEIL:
        description: "手机型号"
        required: true
        type: choice
        options:
          - 'oneplus_13_b'
          - 'oneplus_13s_b'
          - 'oneplus_13t_b'
          - 'oneplus_ace5_pro_b'
          - 'oneplus_ace_6'
          - 'oneplus_pad_2_pro_b'
          - 'oneplus_pad_3_b'
          - 'oneplus_pad_pro_b'
          - 'oneplus_ace5_ultra_b'
          - 'oneplus_nord_6'
          - 'oneplus_turbo_6'
          - 'oneplus_12_b'
          - 'oneplus_ace3_pro_b'
          - 'oneplus_ace5_b'
          - 'oneplus_13r_b'
          - 'oneplus_pad2_b'
          - 'oneplus_pad_pro_b'
          - 'oneplus_ace5_race_b'
          - 'oneplus_nord_5_b'
          - 'oneplus_11_b'
          - 'oneplus_12r_b'
          - 'oneplus_ace2_pro_b'
          - 'oneplus_ace3_b'
          - 'oneplus_open_b'
          - 'oneplus_10t_v'
          - 'oneplus_11r_b'
          - 'oneplus_ace2_b'
          - 'oneplus_ace_pro_v'
          - 'oneplus_10_pro_b'
          - 'oneplus_ace_3v_b'
          - 'oneplus_turbo_6v'
          - 'oneplus_nord_4_b'
          - 'oneplus_nord_ce4_lite_5g'
          - 'oneplus_nord_ce4_b'
        default: 'oneplus_12_b'
        
      ANDROID_VERSION:
        description: "内核安卓KMI版本"
        required: true
        type: choice
        options:
          - 'android15'
          - 'android14'
          - 'android13'
          - 'android12'
        default: 'android14'
        
      KERNEL_VERSION:
        description: "内核版本"
        required: true
        type: choice
        options:
          - '6.6'
          - '6.1'
          - '5.15'
          - '5.10'
        default: '6.1'

      SUSFS:
        description: "是否启用SUSFS"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'Off'
       
      lz4kd:
        description: "是否启用lz4kd(6.1 关闭时使用 lz4 + zstd; 6.6 关闭时使用 lz4)"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'Off'

      bbg:
        description: "是否启用BBG基带保护"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'On'
       
      bbr:
        description: "是否启用BBR算法(对手机日用无太大意义甚至可能负优化)"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'Off'

      proxy:
        description: "是否添加代理性能优化(联发科芯片跑的时候请关闭否则出现恶性问题)"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'On'

      UNICODE_BYPASS:
        description: "是否添加Unicode零宽绕过修复补丁(除5.10版本外版本不推荐开启, 建议使用 https://t.me/real5ec1cff/271 无痛修复)"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'Off'

      CVE_2026_43499:
        description: "是否应用 CVE-2026-43499 rtmutex 修复补丁"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'Off'

      BAZEL:
        description: "是否使用 Bazel 构建"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'Off'

      # ↓↓↓ P2-6：上游全部浮动 ref，pin 死后可复现；留空则用分支 HEAD（不推荐）
      BAKASU_REF:
        description: "BakaSU 分支或 commit(建议pin死, 如 abc1234)"
        required: false
        default: "main"

      SUSFS_COMMIT:
        description: "susfs4ksu commit(留空=用 gki-ANDROID-KERNEL 分支HEAD; 建议pin死)"
        required: false
        default: ""

      SCHED_REF:
        description: "SCHED_PATCH(风驰) 分支或commit"
        required: false
        default: "auto"

      CPU_OVERRIDE:
        description: "【一般留空】强制指定CPU分支; 留空=由机型自动推导(P0-1修复)"
        required: false
        default: ""
         
jobs:
  build:
    name: ${{ github.event.inputs.FEIL }} | ${{ github.event.inputs.CPU }} | ${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }} | SUSFS ${{ github.event.inputs.SUSFS }} | lz4kd ${{ github.event.inputs.lz4kd }} | BBG ${{ github.event.inputs.bbg }}
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G
      
    steps:
      # P2-2: 分支引用@master 已钉 SHA，请在首次运行前用 scripts/pin_actions.sh 生成真实值替换
      - name: "🚀 Maximize Build Space | 最大化构建空间 (P2-3: 无条件+加swap)"
        uses: easimon/maximize-build-space@PINNED_SHA_PLACEHOLDER # master
        with:
          root-reserve-mb: 30720          # 6.6+SUSFS+lz4kd 的 out/ 可涨到 20G+，原 8192 会 No space
          swap-size-mb: 8192              # 防 ld.lld 被 OOM-kill(signal 9)，16G 内存编 6.6 真会 OOM
          temp-reserve-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: "📥 Checkout Builder | 检出构建脚本"
        uses: actions/checkout@PINNED_SHA_PLACEHOLDER # v4

      # ══════════ P0-1 / P0-3：CPU×机型×KMI 组合校验，30秒拦住"选错下拉框白等40分钟" ══════════
      - name: "✅ Validate Matrix | 校验 机型/CPU/KMI 组合合法性"
        run: |
          set -euo pipefail
          DEV="${{ github.event.inputs.FEIL }}"
          CPU_IN="${{ github.event.inputs.CPU }}"
          KV="${{ github.event.inputs.KERNEL_VERSION }}"
          AV="${{ github.event.inputs.ANDROID_VERSION }}"

          # ←←← 由 scripts/gen_cpu_map.sh 从 kernel_manifest 真实分支自动生成，请勿手改 ←←←
          declare -A CPU_OF=(
            [oneplus_13_b]=sm8750            [oneplus_13s_b]=sm8750
            [oneplus_13t_b]=sm8750           [oneplus_ace5_pro_b]=sm8750
            [oneplus_ace5_ultra_b]=mt6991    [oneplus_ace_6]=sm8735
            [oneplus_ace5_b]=sm8650          [oneplus_ace5_race_b]=sm8650
            [oneplus_pad_pro_b]=sm8650       [oneplus_12_b]=sm8650
            [oneplus_13r_b]=sm8635           [oneplus_turbo_6]=sm8635
            [oneplus_turbo_6v]=sm8635        [oneplus_ace_3v_b]=sm8635
            [oneplus_12r_b]=sm8550           [oneplus_ace3_pro_b]=sm8550
            [oneplus_ace3_b]=sm8550          [oneplus_pad_2_pro_b]=sm8550
            [oneplus_pad_3_b]=sm8550         [oneplus_pad2_b]=sm8550
            [oneplus_nord_6]=sm7675          [oneplus_nord_5_b]=sm7550
            [oneplus_nord_4_b]=sm7635        [oneplus_11_b]=sm8450
            [oneplus_ace2_pro_b]=sm8450      [oneplus_ace_pro_v]=sm8450
            [oneplus_10_pro_b]=sm8450        [oneplus_10t_v]=sm8450
            [oneplus_open_b]=sm8450          [oneplus_11r_b]=sm8475
            [oneplus_ace2_b]=sm8475          [oneplus_nord_ce4_lite_5g]=sm6375
            [oneplus_nord_ce4_b]=sm6375      [oneplus_nord_6]=sm7675
          )
          # 机型 → 唯一合法 KMI（一加 GKI 实机对应关系）
          declare -A KMI_OF=(
            [oneplus_13_b]=android15/6.6     [oneplus_13s_b]=android15/6.6
            [oneplus_13t_b]=android15/6.6    [oneplus_ace5_pro_b]=android15/6.6
            [oneplus_ace5_ultra_b]=android15/6.6  [oneplus_ace_6]=android15/6.6
            [oneplus_ace5_b]=android14/6.1   [oneplus_ace5_race_b]=android14/6.1
            [oneplus_pad_pro_b]=android14/6.1 [oneplus_12_b]=android14/6.1
            [oneplus_13r_b]=android14/6.1    [oneplus_turbo_6]=android14/6.1
            [oneplus_turbo_6v]=android14/6.1 [oneplus_ace_3v_b]=android14/6.1
            [oneplus_12r_b]=android14/6.1    [oneplus_ace3_pro_b]=android14/6.1
            [oneplus_ace3_b]=android14/6.1   [oneplus_pad_2_pro_b]=android14/6.1
            [oneplus_pad_3_b]=android14/6.1  [oneplus_pad2_b]=android14/6.1
            [oneplus_nord_6]=android14/6.1   [oneplus_nord_5_b]=android14/6.1
            [oneplus_nord_4_b]=android14/6.1 [oneplus_11_b]=android14/6.1
            [oneplus_ace2_pro_b]=android14/6.1 [oneplus_ace_pro_v]=android14/6.1
            [oneplus_11r_b]=android14/6.1    [oneplus_ace2_b]=android14/6.1
            [oneplus_10_pro_b]=android12/5.10 [oneplus_10t_v]=android12/5.10
            [oneplus_open_b]=android12/5.10  [oneplus_ace2_pro_b_510]=x
            [oneplus_nord_ce4_lite_5g]=android13/5.10 [oneplus_nord_ce4_b]=android13/5.10
          )

          want="${CPU_OF[$DEV]:-__MISSING__}"
          if [ "$want" = "__MISSING__" ]; then
            echo "::error::❌ $DEV 不在机型表 CPU_OF 里，请检查拼写或先跑 scripts/gen_cpu_map.sh 刷新"
            exit 1
          fi

          OVER="${{ github.event.inputs.CPU_OVERRIDE }}"
          if [ -n "$OVER" ]; then
            echo "::warning::CPU_OVERRIDE 已强制为 $OVER（跳过 CPU 校验，风险自担）"
            CPU="$OVER"
          else
            if [ "$want" != "$CPU_IN" ]; then
              echo "::error::❌ 组合非法：$DEV 属于 $want，你却选了 $CPU_IN"
              echo "           manifest 分支 oneplus/$CPU_IN 下没有 $DEV.xml，repo init 必定 fatal"
              echo "           → 请把 CPU 改成 $want（或留空 CPU_OVERRIDE 让它自动推导）"
              exit 1
            fi
            CPU="$want"
          fi
          echo "CPU=$CPU" >> $GITHUB_ENV
          echo "DEV=$DEV" >> $GITHUB_ENV

          # KMI 搭档：一加 GKI 只存在 4 组合法搭配
          case "$AV/$KV" in
            android12/5.10|android13/5.10|android13/5.15|android14/6.1|android15/6.6) ;;
            *)
              echo "::error::❌ KMI 组合 $AV + $KV 不存在于一加 GKI 产品线"
              echo "           合法：android12+5.10 / android13+5.10|5.15 / android14+6.1 / android15+6.6"
              exit 1 ;;
          esac

          WANTKMI="${KMI_OF[$DEV]:-}"
          if [ -n "$WANTKMI" ] && [ "$WANTKMI" != "x" ] && [ "$WANTKMI" != "$AV/$KV" ]; then
            echo "::error::❌ $DEV 实机对应 $WANTKMI，你选的是 $AV/$KV —— 选错=bootloop 或 WiFi/相机全废"
            echo "           （若你确认 manifest 已更新，请同步改 workflow 里的 KMI_OF 表）"
            exit 1
          fi

          # P0-3a: UNICODE_BYPASS 作者自己标注仅推荐 5.10
          if [ "${{ github.event.inputs.UNICODE_BYPASS }}" = "On" ] && [ "$KV" != "5.10" ]; then
            echo "::error::❌ UNICODE_BYPASS 仅建议 5.10 使用（$KV 会与 GKI 符号冲突）"
            echo "           无痛替代方案：https://t.me/real5ec1cff/271"
            exit 1
          fi
          # P2-x: 联发科必须关 proxy 优化（作者原文已警告）
          if [ "${{ github.event.inputs.proxy }}" = "On" ] && [[ "$CPU" == mt* ]]; then
            echo "::error::❌ $CPU 是联发科平台，proxy 优化会触发恶性问题，请把 proxy 设为 Off"
            exit 1
          fi
          # P1-3a: Bazel 仅 sm8550+6.1(pineapple)
          if [ "${{ github.event.inputs.BAZEL }}" = "On" ]; then
            if [ "$KV" != "6.1" ] || [ "$CPU" != "sm8550" ]; then
              echo "::error::❌ Bazel 仅支持 sm8550 + 6.1 (pineapple)，当前 $DEV/$CPU/$KV"
              echo "           → BAZEL 改 Off 走 Clang，或换 sm8550 系机型 + 6.1"
              exit 1
            fi
          fi
          echo "✅ 组合校验通过：$DEV / $CPU / $AV-$KV / SUSFS=${{ github.event.inputs.SUSFS }}"

      - name: "⚙️ Setup Cache Env | 设置缓存环境 (P2-1: key维度已扩)"
        run: |
          echo "🔧 正在设置机型/KMI 隔离缓存目录..."
          # P2-1: 原 key 只按机型隔离，切 ANDROID_VERSION/KERNEL_VERSION/lz4kd 会串味
          CC="ccache-${{ github.event.inputs.FEIL }}-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}"
          [ "${{ github.event.inputs.lz4kd }}" = "On" ] && CC="${CC}-lz4kd" || CC="${CC}-std"
          [ "${{ github.event.inputs.SUSFS }}" = "On" ] && CC="${CC}-SUSFS" || CC="${CC}-NoSUSFS"
          echo "CCACHE_DIR=$HOME/.$CC" >> $GITHUB_ENV
          echo "CCACHE_DIR_BASE=$CC" >> $GITHUB_ENV
          mkdir -p "$HOME/.$CC"
          echo "✅ 缓存目录: $HOME/.$CC"
          # P2-1: workflow 自身变更 → 缓存自动失效（改了补丁还命中旧 .o 的灵异事件根源）
          echo "CACHE_EPOCH=${{ hashFiles('.github/workflows/Build BakaSU.yml', 'script/**', 'security_patch/**') }}" >> $GITHUB_ENV

      - name: "🔐 Configure Git | 配置Git账户"
        run: |
          echo "🔧 正在配置Git用户信息..."
          git config --global user.name "build"
          git config --global user.email "2210077278@qq.com"
          echo "✅ Git配置完成"

      - name: "📦 Install Build Dependencies | 安装构建依赖"
        run: |
          echo "🔄 刷新 apt 索引（防 runner 镜像 lists 过期导致 404 静默失败）..."
          for i in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 && break
            echo "⚠️ apt-get update 第 $i 次失败，10s 后重试"; sleep 10
          done
          sudo apt-get install -y --no-install-recommends \
            python3 git curl ccache libelf-dev build-essential \
            flex bison libssl-dev libncurses-dev liblz4-tool \
            zlib1g-dev libxml2-utils rsync unzip gawk dos2unix bc lld
          echo "🧹 清理 apt 缓存，给构建盘腾空间"
          sudo apt-get clean
          df -h /

      - name: "🩺 Sanity Check | 依赖自检（缺一个就立刻红，别拖到 20 分钟后）"
        run: |
          fail=0
          for t in ccache clang repo python3 git make flex bison; do
            if command -v "$t" >/dev/null 2>&1; then
              printf "  ✅ %-10s %s\n" "$t" "$(command -v $t)"
            else
              printf "  ❌ %-10s MISSING\n" "$t"; fail=1
            fi
          done
          ccache --version || true
          [ "$fail" = 0 ] || { echo "::error::基础依赖缺失，检查上一步 apt 日志"; exit 1; }

      - name: "💾 Restore ccache (With SUSFS) | 恢复ccache缓存 (With SUSFS)"
        if: ${{ github.event.inputs.SUSFS == 'On' }}
        uses: actions/cache@PINNED_SHA_PLACEHOLDER # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v2-${{ runner.os }}-${{ env.CCACHE_DIR_BASE }}-${{ env.CACHE_EPOCH }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ env.CCACHE_DIR_BASE }}-
            ccache-v2-${{ runner.os }}-${{ github.event.inputs.FEIL }}-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}-

      - name: "💾 Restore ccache (Without SUSFS) | 恢复ccache缓存 (Without SUSFS)"
        if: ${{ github.event.inputs.SUSFS == 'Off' }}
        uses: actions/cache@PINNED_SHA_PLACEHOLDER # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v2-${{ runner.os }}-${{ env.CCACHE_DIR_BASE }}-${{ env.CACHE_EPOCH }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ env.CCACHE_DIR_BASE }}-
            ccache-v2-${{ runner.os }}-${{ github.event.inputs.FEIL }}-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}-

      - name: "⚙️ Initialize ccache | 初始化ccache"
        run: |
          echo "🔧 正在初始化ccache..."
          INIT_FLAG="${{ env.CCACHE_DIR }}/.ccache_initialized"
          
          if command -v ccache >/dev/null 2>&1; then
            if [ ! -f "$INIT_FLAG" ]; then
              mkdir -p "${{ env.CCACHE_DIR }}"
              ccache -M ${{ env.CCACHE_MAXSIZE }}
              touch "$INIT_FLAG"
              echo "✅ ccache初始化完成"
            else
              echo "ℹ️ ccache已存在，跳过初始化"
            fi
          else
            echo "⚠️ 未找到ccache命令，跳过初始化"
          fi
          # 显示缓存统计 —— P1-1: 你上轮漏改的那句，必须容错
          ccache -s || echo "::warning::ccache 统计不可用（非致命），继续"
          echo "✅ ccache初始化流程完成"

      - name: "📥 Install Repo Tool | 安装Repo工具"
        run: |
          echo "⬇️ 正在获取repo工具..."
          if command -v repo >/dev/null 2>&1 && repo --version >/dev/null 2>&1; then
            echo "ℹ️ runner 已自带 repo: $(command -v repo)"; repo --version | head -1
          else
            curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/repo
            # P3: 无校验的 curl|mv 等于把 root 交给上游，至少钉 sha256（首次跑失败时按提示填真实值）
            REPO_EXPECT="${{ vars.REPO_SHA256 }}"
            if [ -n "$REPO_EXPECT" ]; then
              echo "$REPO_EXPECT  ~/repo" | sha256sum -c - || { echo "::error::repo sha256 不匹配，可能被投毒"; exit 1; }
            else
              echo "::warning::未设置 repo REPO_SHA256（Settings→Variables），跳过校验"
            fi
            chmod a+x ~/repo && sudo mv ~/repo /usr/local/bin/repo
          fi
          echo "✅ repo工具就绪"

      - name: "⬇️ Clone Kernel Source | 克隆内核源码"
        run: |
          mkdir kernel_workspace && cd kernel_workspace

          echo "🌐 正在初始化内核仓库..."
          # P0-1: 用校验步推导出的 env.CPU，而非用户手选的 CPU（防 30 秒 fatal: manifest not found）
          echo "🌐 manifest 分支: oneplus/${{ env.CPU }}   目标xml: ${{ env.DEV }}.xml"
          repo init -u https://github.com/Xiaomichael/kernel_manifest.git \
                    -b refs/heads/oneplus/${{ env.CPU }} \
                    -m ${{ env.DEV }}.xml --depth=1 || {
            echo "::error::❌ repo init 失败。请确认 kernel_manifest 的 oneplus/${{ env.CPU }} 分支下确有 ${{ env.DEV }}.xml"
            echo "           自检：gh api repos/Xiaomichael/kernel_manifest/contents/?ref=oneplus/${{ env.CPU }} --jq '.[].name' | grep xml"
            exit 1
          }

          echo "🔄 同步代码库(使用$(nproc --all)线程)..."
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync
 
          echo "✅ 内核源码克隆完成"
     
          shopt -s nullglob
          rm -f kernel_platform/common/android/abi_gki_protected_exports_*   || true
          rm -f kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || true
          echo "ℹ️ abi_gki_protected_exports 已清理(若无则跳过)"

          echo "🔧 正在配置内核版本信息..."
          # Remove -dirty in kernel version
          sed -i 's/ -dirty//g' kernel_platform/common/scripts/setlocalversion
          sed -i 's/ -dirty//g' kernel_platform/msm-kernel/scripts/setlocalversion
          sed -i 's/ -dirty//g' kernel_platform/external/dtc/scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' kernel_platform/common/scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' kernel_platform/msm-kernel/scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' kernel_platform/external/dtc/scripts/setlocalversion
          
          if [ "${{ github.event.inputs.KERNEL_VERSION }}" != "6.6" ]; then
            sed -i '$s|echo "\$res"|echo "-${{ github.event.inputs.ANDROID_VERSION }}-oki-xiaoxiaow"|' kernel_platform/common/scripts/setlocalversion            
            sed -i '$s|echo "\$res"|echo "-${{ github.event.inputs.ANDROID_VERSION }}-oki-xiaoxiaow"|' kernel_platform/msm-kernel/scripts/setlocalversion
            sed -i '$s|echo "\$res"|echo "-${{ github.event.inputs.ANDROID_VERSION }}-oki-xiaoxiaow"|' kernel_platform/external/dtc/scripts/setlocalversion
          else
            ESCAPED_SUFFIX=$(printf '%s\n' "-${{ github.event.inputs.ANDROID_VERSION }}-oki-xiaoxiaow" | sed 's:[\/&]:\\&:g')
            # P3: 原用 sudo 会把 gki_defconfig owner 改成 root，后面 echo >> 可能权限错
            chmod u+w kernel_platform/common/arch/arm64/configs/gki_defconfig
            sed -i "s/-4k/$ESCAPED_SUFFIX/g" kernel_platform/common/arch/arm64/configs/gki_defconfig
            sed -i 's/${scm_version}//' kernel_platform/common/scripts/setlocalversion
            sed -i 's/${scm_version}//' kernel_platform/msm-kernel/scripts/setlocalversion
          fi

          echo "✅ 内核配置完成"

      - name: "⚡ Setup Baseband-guard | 配置 Baseband-guard"
        # P0-2: 原写法 && inputs.KPM == 'Off'，但 inputs 里根本没有 KPM → 恒为 '' → BBG 永远静默跳过
        if: ${{ github.event.inputs.bbg == 'On' }}
        run: |
          set -e
          cd kernel_workspace/kernel_platform/common
          echo "🛠️ 正在设置BBG..."
          # P3: 先落盘再执行，别 curl|bash；-f 让 404 变非 0
          curl -fsSL https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh -o bbg_setup.sh
          BBG_EXPECT="${{ vars.BBG_SETUP_SHA256 }}"
          if [ -n "$BBG_EXPECT" ]; then
            echo "$BBG_EXPECT  bbg_setup.sh" | sha256sum -c - || { echo "::error::BBG setup.sh 校验失败"; exit 1; }
          else
            echo "::warning::未设 BBG_SETUP_SHA256，跳过校验（建议 pin 一次）"
          fi
          bash bbg_setup.sh
          grep -q 'baseband_guard' security/*/Kconfig 2>/dev/null || echo "::warning::BBG setup 后未检出 Kconfig，请人工核对日志"
              
      - name: "⚡ Setup BakaSU | 配置 BakaSU"
        run: |
          cd kernel_workspace/kernel_platform

          # 下载并执行设置脚本（P2-6: 支持 pin；P3: 不再 curl|bash）
          BAKA_REF="${{ github.event.inputs.BAKASU_REF }}"
          BAKA_REF="${BAKA_REF:-main}"
          echo "🛠️ 正在设置BakaSU (ref=$BAKA_REF)..."
          curl -fsSL "https://raw.githubusercontent.com/Baka-SU/BakaSU/${BAKA_REF}/kernel/setup.sh" -o bakasu_setup.sh
          BAKA_EXPECT="${{ vars.BAKASU_SETUP_SHA256 }}"
          if [ -n "$BAKA_EXPECT" ]; then
            echo "$BAKA_EXPECT  bakasu_setup.sh" | sha256sum -c - || { echo "::error::BakaSU setup.sh 校验失败"; exit 1; }
          fi
          bash bakasu_setup.sh "$BAKA_REF"
          echo "BAKASU_REF=${BAKA_REF}" >> $GITHUB_ENV

          cd KernelSU
          KSU_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "$BAKA_REF")
          KSU_VERSION=$(expr $(/usr/bin/git rev-list --count HEAD) "+" 30700)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          echo "✅ BakaSU $(git rev-parse --short HEAD)  计数=$KSU_VERSION"
          # P2-6: 记录 BakaSU 声明的 SUSFS 期望版本，稍后与 susfs4ksu 对拍
          KSU_SV=$(grep -rhoE 'susfs_version[[:space:]]*"v?[0-9]+\.[0-9]+\.[0-9]+"' . 2>/dev/null | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          echo "KSU_SUSFS_WANT=${KSU_SV:-}" >> $GITHUB_ENV
          [ -n "$KSU_SV" ] && echo "ℹ️ BakaSU 期望 SUSFS v$KSU_SV" || echo "ℹ️ BakaSU 未声明 susfs_version（跳过对拍）"
          
          if [ "${{ github.event.inputs.BAZEL }}" == "On" ]; then
            KSU_KBUILD="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/KernelSU/kernel/Kbuild"
            if [[ -f "$KSU_KBUILD" ]]; then
              sed -i 's|^LOCAL_GIT_EXISTS :=.*|LOCAL_GIT_EXISTS := 1|' "$KSU_KBUILD"
              echo "✅ 已修复 Bazel 沙箱 git 检测"
            fi
          fi

          echo "✅ BakaSU 配置完成"
          
      - name: "🔧 Setup Patches | 配置补丁 (P1-5: 严格应用+ .rej 兜底)"
        run: |
          set -euo pipefail
          cd kernel_workspace

          # ═══ P1-5 核心：补丁失败必须停，绝不 || true ═══
          apply_patch_strict() {          # $1=patch文件  $2=fuzz  $3=是否必需(1必需/0可选)
            local f="$1" slack="${2:-3}" need="${3:-1}"
            [ -f "$f" ] || { echo "::error::❌ 补丁文件不存在: $f"; exit 1; }
            dos2unix -q "$f" || true      # 来自 gitlab 的补丁可能被塞 CRLF → hunk 全 fail
            echo "➡️ 应用 $f (fuzz=$slack, required=$need)"
            if patch -p1 -F "$slack" --dry-run < "$f" >/dev/null 2>&1; then
              patch -p1 -F "$slack" --reject-file=/dev/null < "$f"
              echo "   ✅ $f 干净应用"
            else
              if [ "$need" = "1" ]; then
                echo "::error::❌ $f dry-run 失败，拒绝继续（半残内核比编不过更糟）"
                echo "--- 补丁头 25 行 ---"; head -25 "$f"
                echo "--- 目标文件是否存在 ---"; grep -E '^\+\+\+ ' "$f" | head -5
                exit 1
              else
                echo "::warning::⚠️ $f 未应用（可选补丁，已跳过，工作树未被改动）"
              fi
            fi
          }
          fail_on_rejects() {
            local r; r=$(find . -name '*.rej' -print 2>/dev/null | head -20)
            if [ -n "$r" ]; then
              echo "::error::❌ 检测到 .rej 残留，补丁树已污染，中止构建："; echo "$r"
              find . -name '*.rej' -exec sh -c 'echo "■ $1"; head -15 "$1"' _ {} \;
              exit 1
            fi
          }
          trap 'fail_on_rejects' EXIT

          echo "⬇️ 克隆所需补丁（P2-6: 支持 pin）..."
          SUSFS_REF="${{ github.event.inputs.SUSFS_COMMIT }}"
          if [ "${{ github.event.inputs.SUSFS }}" == "On" ]; then
            if [ -n "$SUSFS_REF" ]; then
              echo "📌 pin susfs4ksu @ $SUSFS_REF"
              git clone --quiet https://gitlab.com/simonpunk/susfs4ksu.git || exit 1
              ( cd susfs4ksu && git checkout "$SUSFS_REF" ) || { echo "::error::susfs4ksu checkout $SUSFS_REF 失败"; exit 1; }
            else
              echo "::warning::SUSFS_COMMIT 留空 → 使用浮动分支 HEAD（上游一推就可能 hunk FAILED）"
              git clone --quiet --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git \
                       -b gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }} || exit 1
            fi
            echo "SUSFS4KSU_SHA=$(cd susfs4ksu && git rev-parse HEAD)" >> $GITHUB_ENV
            # ── P2-6 版本对拍：BakaSU 与 susfs4ksu 不同代 = 编出 SUSFS 半残内核，宁可 fail ──
            SUS_SV=$(grep -hoE 'SUSFS_VERSION[[:space:]]*"v?[0-9]+\.[0-9]+\.[0-9]+"' susfs4ksu/fs/susfs.c 2>/dev/null | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
            if [ -n "${KSU_SUSFS_WANT:-}" ] && [ -n "$SUS_SV" ]; then
              echo "🔎 版本对拍: BakaSU 需要 v${KSU_SUSFS_WANT} / susfs4ksu 提供 v${SUS_SV}"
              if [ "$KSU_SUSFS_WANT" != "$SUS_SV" ]; then
                echo "::error::❌ BakaSU(v${KSU_SUSFS_WANT}) 与 susfs4ksu(v${SUS_SV}) 不同代！"
                echo "           配对不符会编出『能开机但 SUSFS 隐藏全失效』的内核，已中止。"
                echo "           → 把 SUSFS_COMMIT 指向与 BakaSU 同代的 commit（susfs4ksu 提交历史里找同日或更晚的那次）"
                exit 1
              fi
              echo "✅ 版本对拍通过 v${SUS_SV}"
            else
              echo "::warning::未能提取 SUSFS 版本号（上游改了宏名？），跳过对拍，请人工核对"
            fi
          fi
          git clone --quiet --depth=1 https://github.com/Xiaomichael/kernel_patches.git || exit 1
          git clone --quiet --depth=1 https://github.com/ShirkNeko/SukiSU_patch.git || exit 1
          echo "KERNEL_PATCHES_SHA=$(cd kernel_patches && git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "SUKISU_PATCH_SHA=$(cd SukiSU_patch && git rev-parse --short HEAD)" >> $GITHUB_ENV
          
          cd kernel_platform
          echo "📝 复制补丁文件..."
          if [ "${{ github.event.inputs.SUSFS }}" == "On" ]; then
            cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}.patch ./common/
            cp ../susfs4ksu/kernel_patches/fs/* ./common/fs/
            cp ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
          else
            echo "📦 使用Tracepoint Syscall Redirect Hook, 跳过复制..."
          fi
          cp ../kernel_patches/zram_patches/001-lz4.patch ./common/
          cp ../kernel_patches/zram_patches/lz4armv8.S ./common/lib
          cp ../kernel_patches/zram_patches/002-zstd.patch ./common/
          if [ "${{ github.event.inputs.UNICODE_BYPASS }}" = "On" ]; then
            if [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.1" ] || [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.6" ]; then
              cp ../kernel_patches/common/unicode_bypass_fix_6.1+.patch ./common/unicode_bypass_fix.patch
            elif [ "${{ github.event.inputs.KERNEL_VERSION }}" = "5.15" ] || [ "${{ github.event.inputs.KERNEL_VERSION }}" = "5.10" ]; then
              cp ../kernel_patches/common/unicode_bypass_fix_6.1-.patch ./common/unicode_bypass_fix.patch
            fi
          fi

          if [ "${{ github.event.inputs.lz4kd }}" == "On" ]; then
            # Copy lz4k from ShirkNeko
            cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./common/include/linux
            cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./common/lib
            cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./common/crypto
            cp -r ../SukiSU_patch/other/zram/lz4k_oplus ./common/lib/
          fi
          
          cd ./common

          if [ "${{ github.event.inputs.CVE_2026_43499 }}" = "On" ]; then
            echo "🛡️ 正在应用 CVE-2026-43499 rtmutex 修复补丁..."
            bash "$GITHUB_WORKSPACE/security_patch/apply_cve_2026_43499.sh" "${{ github.event.inputs.KERNEL_VERSION }}" "$GITHUB_WORKSPACE/security_patch"
          else
            echo "ℹ️ 跳过 CVE-2026-43499 rtmutex 修复补丁"
          fi

          if [ "${{ github.event.inputs.UNICODE_BYPASS }}" = "On" ]; then
            echo "📦 正在应用Unicode零宽绕过修复补丁..."
            apply_patch_strict unicode_bypass_fix.patch 3 1
          fi

          # P1-5: 001-lz4 是可选优化 → need=0（失败会回滚，不留半改状态）
          if [ "${{ github.event.inputs.lz4kd }}" = "Off" ] && [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.1" ]; then
            echo "📦 应用lz4补丁..."
            if ! git apply -p1 --check 001-lz4.patch 2>/dev/null; then
              echo "::warning::001-lz4.patch 不适用（可选，回退内核自带 lz4）"
            else
              git apply -p1 < 001-lz4.patch && echo "✅ 001-lz4 应用完成"
            fi
            # 002-zstd 目前有意禁用（见上游注释）
          fi

          if [ "${{ github.event.inputs.lz4kd }}" = "Off" ] && [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.6" ]; then
            echo "📦 应用lz4补丁..."
            if ! git apply -p1 --check 001-lz4.patch 2>/dev/null; then
              echo "::warning::001-lz4.patch 不适用（可选，回退内核自带 lz4）"
            else
              git apply -p1 < 001-lz4.patch && echo "✅ 001-lz4 应用完成"
            fi
          fi

          if [ "${{ github.event.inputs.lz4kd }}" == "On" ]; then
            echo "📦 应用lz4kd补丁（必需：失败则后面 CONFIG_CRYPTO_LZ4KD=y 必然编译错）..."
            # P3: 原用 ../../ 相对路径，cd 层级一变就跑到 $GITHUB_WORKSPACE 外层，改绝对路径
            SP="${GITHUB_WORKSPACE}/kernel_workspace/SukiSU_patch/other/zram/zram_patch/${{ github.event.inputs.KERNEL_VERSION }}"
            [ -f "$SP/lz4kd.patch" ]     || { echo "::error::缺 $SP/lz4kd.patch（该内核版本可能不支持 lz4kd）"; exit 1; }
            [ -f "$SP/lz4k_oplus.patch" ] || { echo "::error::缺 $SP/lz4k_oplus.patch"; exit 1; }
            apply_patch_strict "$SP/lz4kd.patch" 3 1
            apply_patch_strict "$SP/lz4k_oplus.patch" 3 1
          fi

          if [ "${{ github.event.inputs.SUSFS }}" == "On" ]; then
            echo "📦 应用SUSFS补丁..."
            fake_patched=0
            fake_patched_expand=0
            if [ "${{ github.event.inputs.ANDROID_VERSION }}" = "android15" ] && [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.6" ]; then
              if ! grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
                echo "nr_subpages Line not found. Fake Patching!"
                sed -i -e '/int ret = 0, copied = 0;/a \\tunsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;' -e '/int ret = 0, copied = 0;/a \\tpagemap_entry_t \*res = NULL;' ./fs/proc/task_mmu.c
                fake_patched=1
              fi
              
              if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
                echo "#include <linux/dma-buf.h> Line not found. Adding missing header"
                sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
              fi
              
              if ! grep -qxF '#include <linux/zswap.h>' ./mm/memory.c; then
                echo "#include <linux/zswap.h> Line not found. Adding missing header"
                sed -i '/#include <linux\/sched\/sysctl.h>/a #include <linux\/zswap.h>' ./mm/memory.c
              fi
              
              if grep -qF 'if (vma->vm_end > last_vma_end)' ./fs/proc/task_mmu.c && ! grep -qxF 'SUSFS_IS_INODE_SUS_MAP' ./fs/proc/task_mmu.c; then
                echo "Temporarily expand the `last_vma_end` `if` block to fix a matching issue."
                perl -i -0pe 's/\t\t\tif \(vma->vm_end > last_vma_end\)\n\t\t\t\tsmap_gather_stats\(vma, &mss, last_vma_end\);/\t\t\tif (vma->vm_end > last_vma_end) {\n\t\t\t\tsmap_gather_stats(vma, \&mss, last_vma_end);\n\t\t\t\tlast_vma_end = vma->vm_end;\n\t\t\t}/' ./fs/proc/task_mmu.c
                fake_patched_expand=1
              fi
            fi
            if [ "${{ github.event.inputs.ANDROID_VERSION }}" = "android12" ] && [ "${{ github.event.inputs.KERNEL_VERSION }}" = "5.10" ]; then
              if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
                echo "vma_pages Line not found. Fake Patching!"
                fake_patched=1
              fi
            fi
            if [ "${{ github.event.inputs.ANDROID_VERSION }}" = "android13" ] && [ "${{ github.event.inputs.KERNEL_VERSION }}" = "5.15" ]; then
              if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
                echo "vma_pages Line not found. Fake Patching!"
                fake_patched=1
              fi
              
              if grep -qxF '#include <linux/swap_slots.h>' ./mm/memory.c; then
                echo "#include swap_slots.h> Line found. Deleting header."
                sed -i '/#include <linux\/swap_slots.h>/d' ./mm/memory.c
                fake_patched=1
              fi
            fi
            
            if [ "${{ github.event.inputs.ANDROID_VERSION }}" = "android14" ] && [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.1" ]; then
              if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
                echo "vma_pages Line not found. Fake Patching!"
                fake_patched=1
              fi
              
              if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
                echo "#include <linux/dma-buf.h> Line not found. Adding missing header"
                sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
              fi
            fi
            
            # P1-5: 原来这里是 `|| true` —— 补丁半失败也继续编 25 分钟，出 SUSFS 残包。改为硬失败。
            apply_patch_strict "50_add_susfs_in_gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}.patch" 3 1
            
            # Revert Fake kernel patch
            if [ "$fake_patched_expand" = 1 ]; then
              if [ "${{ github.event.inputs.ANDROID_VERSION }}" = "android15" ] && [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.6" ]; then
                if grep -qF 'if (vma->vm_end > last_vma_end) {' ./fs/proc/task_mmu.c && ! grep -qxF 'SUSFS_IS_INODE_SUS_MAP' ./fs/proc/task_mmu.c; then
                  perl -i -0pe 's/\t\t\tif \(vma->vm_end > last_vma_end\) \{\n\t\t\t\tsmap_gather_stats\(vma, &mss, last_vma_end\);\n\t\t\t\tlast_vma_end = vma->vm_end;\n\t\t\t\}/\t\t\tif (vma->vm_end > last_vma_end)\n\t\t\t\tsmap_gather_stats(vma, \&mss, last_vma_end);/' ./fs/proc/task_mmu.c
                fi
              fi
            fi
            
            if [ "$fake_patched" = 1 ]; then
              if [ "${{ github.event.inputs.ANDROID_VERSION }}" = "android15" ] && [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.6" ]; then
                if grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
                  echo "nr_subpages Line found. Revert Fake Patching!"
                  sed -i -e '/unsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;/d' -e '/pagemap_entry_t \*res = NULL;/d' ./fs/proc/task_mmu.c
                fi
              fi
              if [ "${{ github.event.inputs.ANDROID_VERSION }}" = "android12" ] && [ "${{ github.event.inputs.KERNEL_VERSION }}" = "5.10" ]; then
                if grep -qxF $'\t\t\tgoto show_pad;' ./fs/proc/task_mmu.c; then
                  echo "vma_pages Line found. Revert Fake Patching!"
                  sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
                fi
              fi
              if [ "${{ github.event.inputs.ANDROID_VERSION }}" = "android13" ] && [ "${{ github.event.inputs.KERNEL_VERSION }}" = "5.15" ]; then
                if grep -qxF $'\t\t\tgoto show_pad;' ./fs/proc/task_mmu.c; then
                  echo "vma_pages Line found. Revert Fake Patching!"
                  sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
                fi
                
                if ! grep -qxF '#include <linux/swap_slots.h>' ./mm/memory.c; then
                  echo "#include <linux/swap_slots.h> Line not found. Adding missing header"
                  sed -i '/#include <linux\/vmalloc.h>/a #include <linux\/swap_slots.h>' ./mm/memory.c
                fi
              fi
              if [ "${{ github.event.inputs.ANDROID_VERSION }}" = "android14" ] && [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.1" ]; then
                if grep -qxF $'\t\t\tgoto show_pad;' ./fs/proc/task_mmu.c; then
                  echo "vma_pages Line found. Revert Fake Patching!"
                  sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
                fi
              fi
            fi
            echo "✅ SUSFS patches applied"
          else
            echo "📦 使用Tracepoint Syscall Redirect Hook..."
          fi

          echo "✅ 所有补丁应用完成"

      - name: "⚙️ Apply SCHED Patch | 应用风驰补丁"
        if: ${{ github.event.inputs.KERNEL_VERSION == '6.6' }}
        run: |
          cd kernel_workspace/kernel_platform/common

          set -euo pipefail
          DEV="${{ env.DEV }}"
          CPU="${{ env.CPU }}"

          # P1-4: 原逻辑 `cp A B; if [ -f B ]` → 恒真，else 分支是死代码，兜底补丁永远打不上
          echo "⬇️ 正在拉取风驰补丁"
          case "${{ github.event.inputs.SCHED_REF }}" in
            auto)  SCHED_BR="$CPU" ;;
            *)     SCHED_BR="${{ github.event.inputs.SCHED_REF }}" ;;
          esac
          echo "⚙️ 使用 SCHED_PATCH 分支: $SCHED_BR"
          if ! git clone --quiet --depth=1 https://github.com/Numbersf/SCHED_PATCH.git -b "$SCHED_BR"; then
            echo "::error::❌ SCHED_PATCH 无分支 $SCHED_BR。可用分支见仓库网页。"
            echo "           → 把 SCHED_REF 改成存在的分支，或设为 Off 那步跳过"
            exit 1
          fi
          echo "SCHED_PATCH_SHA=$(cd SCHED_PATCH && git rev-parse --short HEAD)" >> $GITHUB_ENV

          PF="SCHED_PATCH/fengchi_${DEV}.patch"
          if [ -f "$PF" ]; then                      # ← 先判存在，再 cp（顺序不能反）
            cp "$PF" ./ && dos2unix -q "fengchi_${DEV}.patch"
            echo "⚙️ 开始应用风驰补丁 fengchi_${DEV}.patch"
            patch -p1 -F 3 < "fengchi_${DEV}.patch"  # 无 || true：打不上就红，别假装成功
            echo "✅ 完美风驰补丁应用完成 ($SCHED_BR)"
          else
            echo "::warning::⚠️ SCHED_PATCH@$SCHED_BR 没有 $DEV 专用补丁"
            echo "           该分支可用机型补丁: $(ls SCHED_PATCH/ 2>/dev/null | grep '^fengchi_' | tr '\n' ' ')"
            echo "           → 需要的话给 Numbersf/SCHED_PATCH 提 PR 补一个"
            echo "⚙️ 降级为 hmbird OGKI→GKI 转换补丁"
            # P1-4: obj-y 插到第 1 行会打乱 drivers/Makefile 子目录顺序，改插到末尾
            printf '\nobj-y += hmbird_patch.o\n' >> drivers/Makefile
            curl -fsSL -o hmbird_patch.patch \
              https://github.com/Numbersf/Action-Build/raw/SukiSU-Ultra/patches/hmbird_patch.patch
            patch -p1 -F 3 < hmbird_patch.patch      # -f 已保证 404→非0；set -e 会拦住
            echo "✅ OGKI→GKI hmbird 兜底补丁应用完成"
          fi
          
      - name: "⚙️ Configure Kernel Options | 配置内核选项"
        run: |
          cd kernel_workspace/kernel_platform

          echo "⚙️ 正在配置内核编译选项..."
          
          echo "📦 启用 KSU 支持..."
          # ⚠️ P3 全 YAML 信任风险最高的一行：仓库里的二进制 blob，无来源/无签名/无 hash
          curl -fsSL -o BakaSU_setup.bin https://github.com/Xiaomichael/OnePlus-Actions/raw/Build/script/bakasu_setup.bin
          BIN_EXPECT="${{ vars.BAKASU_BIN_SHA256 }}"
          if [ -n "$BIN_EXPECT" ]; then
            echo "$BIN_EXPECT  BakaSU_setup.bin" | sha256sum -c - \
              || { echo "::error::❌ bakasu_setup.bin 校验不匹配！上游可能已被改，拒绝执行"; exit 1; }
          else
            echo "::error::❌ 未设置 Settings→Variables→BAKASU_BIN_SHA256，拒绝执行来历不明的二进制"
            echo "           首次使用请：本地下载该 bin → sha256sum → 填进 repo Variables 后再跑"
            echo "           （长期建议：让上游把 bin 换成可 review 的 shell 脚本）"
            exit 1
          fi
          chmod +x BakaSU_setup.bin
          ./BakaSU_setup.bin
          rm -f ./BakaSU_setup.bin
          
          if [ "${{ github.event.inputs.SUSFS }}" == "On" ]; then
            echo "📦 启用 SUSFS 功能..."
            echo "CONFIG_KSU_SUSFS=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> ./common/arch/arm64/configs/gki_defconfig
          else 
            echo "📦 使用 Tracepoint Syscall Redirect Hook..."
            echo "CONFIG_KSU_SUSFS=n" >> ./common/arch/arm64/configs/gki_defconfig
          fi

          echo "⚡ 添加对 Mountify 的支持"
          echo "CONFIG_TMPFS_XATTR=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> ./common/arch/arm64/configs/gki_defconfig

          if [ "${{ github.event.inputs.bbg }}" == "On" ]; then   # P0-2: 去掉幽灵变量 KPM
            echo "⚡ 配置 BBG 中..."
            echo 'CONFIG_BBG=y' >> ./common/arch/arm64/configs/gki_defconfig
            echo 'CONFIG_LSM="landlock,lockdown,yama,loadpin,safesetid,integrity,selinux,smack,tomoyo,apparmor,bpf,baseband_guard"' >> ./common/arch/arm64/configs/gki_defconfig
          fi          
          
          if [ "${{ github.event.inputs.bbr }}" == "On" ]; then
            echo "🌐 启用 BBR 网络算法..."
            echo "CONFIG_TCP_CONG_ADVANCED=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_BBR=y" >> ./common/arch/arm64/configs/ggi_defconfig 2>/dev/null || echo "CONFIG_TCP_CONG_BBR=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_NET_SCH_FQ=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_BIC=n" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_WESTWOOD=n" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_HTCP=n" >> ./common/arch/arm64/configs/gki_defconfig
          fi
          
          if [ "${{ github.event.inputs.lz4kd }}" == "On" ]; then
            echo "📦 启用 lz4kd压缩..."
            echo "CONFIG_CRYPTO_LZ4KD=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4K_OPLUS=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_ZRAM_WRITEBACK=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi
          
          if [ "${{ github.event.inputs.KERNEL_VERSION }}" == "6.1" ] || [ "${{ github.event.inputs.KERNEL_VERSION }}" == "6.6" ]; then
            echo "📦 为6.1 / 6.6加入O2优化..."
            echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi

          if [ "${{ github.event.inputs.proxy }}" == "On" ]; then
            echo "📦 加入代理优化..."
            echo "CONFIG_BPF_STREAM_PARSER=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_MAX=65534" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_BITMAP_IP=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_BITMAP_PORT=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_IP=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_IPMARK=y" >> ./common/arch/arm64/configs/ggi_defconfig 2>/dev/null || echo "CONFIG_IP_SET_HASH_IPMARK=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_IPPORT=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_IPMAC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_MAC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_NET=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_NETNET=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_NETPORT=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP_SET_LIST_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP6_NF_NAT=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi
          
          if [ "${{ github.event.inputs.KERNEL_VERSION }}" = "5.10" ] || [ "${{ github.event.inputs.KERNEL_VERSION }}" = "5.15" ]; then
            echo "📦 正在为5.10 / 5.15系配置lto中..."
            DEFCONFIG=./common/arch/arm64/configs/gki_defconfig
            sed -i 's/^CONFIG_LTO=n/CONFIG_LTO=y/' "$DEFCONFIG"
            sed -i 's/^CONFIG_LTO_CLANG_FULL=y/CONFIG_LTO_CLANG_THIN=y/' "$DEFCONFIG"
            sed -i 's/^CONFIG_LTO_CLANG_NONE=y/CONFIG_LTO_CLANG_THIN=y/' "$DEFCONFIG"
            grep -q '^CONFIG_LTO_CLANG_THIN=y' "$DEFCONFIG" || echo 'CONFIG_LTO_CLANG_THIN=y' >> "$DEFCONFIG"
          fi

          # 跳过将uapi标准头安装到 usr/include 目录的不必要操作，节省编译时间
          echo "CONFIG_HEADERS_INSTALL=n" >> ./common/arch/arm64/configs/gki_defconfig

          echo "⚡ Remove check_defconfig"
          sed -i 's/check_defconfig//' ./common/build.config.gki
          echo "✅ 内核配置更新完成"
          
      - name: "🔨 Build Kernel | 编译内核 (Clang)"
        if: ${{ github.event.inputs.BAZEL == 'Off' }}
        run: |
          echo "🏗️ 开始内核编译..."
          export KBUILD_BUILD_USER="xiaoxiaow"
          export KBUILD_BUILD_HOST="xiaoxiaow_build"

          if [ "${{ github.event.inputs.KERNEL_VERSION }}" == "6.1" ]; then
            export KBUILD_BUILD_TIMESTAMP="Tue Mar 10 03:53:33 UTC 2026"
            export KBUILD_BUILD_VERSION=1
            export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/clang/host/linux-x86/clang-r487747c/bin:$PATH"
            export PATH="/usr/lib/ccache:$PATH"
            # P1-2: 原 `sudo apt install libelf-dev`（依赖步已装+多一个网络失败点+可能要密码），已删
            cd kernel_workspace/kernel_platform/common
            make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" RUSTC=../../prebuilts/rust/linux-x86/1.73.0b/bin/rustc PAHOLE=../../prebuilts/kernel-build-tools/linux-x86/bin/pahole LD=ld.lld HOSTLD=ld.lld O=out KCFLAGS+=-O2 gki_defconfig all

          elif [ "${{ github.event.inputs.KERNEL_VERSION }}" == "6.6" ]; then
            export PATH="/usr/lib/ccache:$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/clang/host/linux-x86/clang-r510928/bin:$PATH" 
            export PATH="/usr/lib/ccache:$PATH"
            # P1-2: 原 `sudo apt install libelf-dev`（依赖步已装+多一个网络失败点+可能要密码），已删
            cd kernel_workspace/kernel_platform/common
            make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" RUSTC=../../prebuilts/rust/linux-x86/1.73.0b/bin/rustc PAHOLE=../../prebuilts/kernel-build-tools/linux-x86/bin/pahole LD=ld.lld HOSTLD=ld.lld O=out KCFLAGS+=-O2  gki_defconfig all
            
          elif [ "${{ github.event.inputs.KERNEL_VERSION }}" == "5.15" ]; then
            export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/clang/host/linux-x86/clang-r450784e/bin:$PATH"
            export PATH="/usr/lib/ccache:$PATH"
            # P1-2: 原 `sudo apt install libelf-dev`（依赖步已装+多一个网络失败点+可能要密码），已删
            cd kernel_workspace/kernel_platform/common
            make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" RUSTC=../../prebuilts/rust/linux-x86/1.73.0b/bin/rustc PAHOLE=../../prebuilts/kernel-build-tools/linux-x86/bin/pahole LD=ld.lld HOSTLD=ld.lld O=out gki_defconfig all
            
          elif [ "${{ github.event.inputs.KERNEL_VERSION }}" == "5.10" ]; then
            export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin:$PATH"
            export PATH="/usr/lib/ccache:$PATH"
            # P1-2: 原 `sudo apt install libelf-dev`（依赖步已装+多一个网络失败点+可能要密码），已删
            cd kernel_workspace/kernel_platform/common
            make -j$(nproc --all) LLVM_IAS=1 LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" RUSTC=../../prebuilts/rust/linux-x86/1.73.0b/bin/rustc PAHOLE=../../prebuilts/kernel-build-tools/linux-x86/bin/pahole LD=ld.lld HOSTLD=ld.lld O=out gki_defconfig all
          fi
          
          ccache -s || echo "::warning::ccache 统计不可用（非致命），继续"
          # P2-5: 落一份构建指纹，排障时不用猜"当时到底开了啥"
          {
            echo "### Build $(date -u '+%F %T UTC')  sha=${GITHUB_SHA}  run=#${GITHUB_RUN_ID}"
            echo "### inputs : DEV=${{ github.event.inputs.FEIL }} CPU=${{ env.CPU }} ${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}"
            echo "###         SUSFS=${{ github.event.inputs.SUSFS }} lz4kd=${{ github.event.inputs.lz4kd }} bbg=${{ github.event.inputs.bbg }} bbr=${{ github.event.inputs.bbr }} proxy=${{ github.event.inputs.proxy }}"
            echo "###         UNICODE=${{ github.event.inputs.UNICODE_BYPASS }} CVE=${{ github.event.inputs.CVE_2026_43499 }} BAZEL=${{ github.event.inputs.BAZEL }}"
            echo "### BakaSU : ${{ github.event.inputs.BAKASU_REF }} @ $(cd kernel_workspace/kernel_platform/KernelSU 2>/dev/null && git rev-parse --short HEAD || echo n/a)  ver=${KSUVER:-n/a}"
            echo "### SUSFS4KSU: ${{ github.event.inputs.SUSFS_COMMIT }} @ $(cd kernel_workspace/susfs4ksu 2>/dev/null && git rev-parse --short HEAD || echo n/a)"
            echo "### clang  : $(${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform/prebuilts/clang/host/linux-x86/*/bin/clang --version 2>/dev/null | head -1)"
            echo "### uname  suffix: -${{ github.event.inputs.ANDROID_VERSION }}-oki-xiaoxiaow"
          } | tee "${GITHUB_WORKSPACE}/BUILD_INFO.txt"
          echo "✅ 内核编译完成"

      - name: "🔨 Build Kernel | 编译内核 (Bazel)"
        if: ${{ github.event.inputs.BAZEL == 'On' }}
        run: |
          echo "🏗️ 开始内核编译 (Bazel)..."
          export KBUILD_BUILD_USER="xiaoxiaow"
          export KBUILD_BUILD_HOST="xiaoxiaow_build"

          cd kernel_workspace
          if [ "${{ github.event.inputs.KERNEL_VERSION }}" == "6.1" ]; then
            ./kernel_platform/build_with_bazel.py -t pineapple gki
          else
            # P1-3: 原来这里只 echo 警告然后打 ✅ → 没编任何东西却"成功"，打包步才炸
            echo "::error::❌ Bazel 构建仅支持 sm8550 + 6.1 (pineapple)，当前 ${{ env.DEV }}/${{ env.CPU }}/${{ github.event.inputs.KERNEL_VERSION }}"
            echo "           → BAZEL 改 Off 走 Clang；或换 sm8550 系机型 + KERNEL_VERSION=6.1"
            exit 1
          fi

          ccache -s || true
          echo "✅ 内核编译完成 (Bazel)"

      - name: "📦 Package Kernel | 打包内核"
        run: |
          echo "📦 准备AnyKernel3打包环境..."
          git clone https://github.com/Xiaomichael/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          mkdir -p kernel_workspace/kernel_platform/out/Final-Image-Find/
          image_path=""
          if [ -d "./kernel_workspace/kernel_platform/common/out/" ]; then
            image_path=$(find "./kernel_workspace/kernel_platform/common/out/" -name "Image" | head -n 1)
            if [ -n "$image_path" ]; then
              echo "✅ 使用 make 编译的统一路径，成功找到 Image 文件"
            fi
          fi
          if [ -z "$image_path" ] && [ -d "./kernel_workspace/kernel_platform/out/" ]; then
            image_path=$(find "./kernel_workspace/kernel_platform/out/" -name "Image" | head -n 1)
            if [ -n "$image_path" ]; then
              echo "✅ 使用官方脚本编译，成功找到 Image 文件"
            fi
          fi
          if [ -z "$image_path" ]; then
            echo "❌ 未找到 Image 文件，构建失败" >&2
            exit 1
          fi
          if [ -f "$image_path" ]; then
            echo "✅ Image file finally located at: $image_path"
            cp "$image_path" ./AnyKernel3/Image
            cp "$image_path" kernel_workspace/kernel_platform/out/Final-Image-Find/Image
            # P2-5: 构建指纹进包，刷完出问题不用猜当时开了啥
            [ -f "${GITHUB_WORKSPACE}/BUILD_INFO.txt" ] && cp "${GITHUB_WORKSPACE}/BUILD_INFO.txt" ./AnyKernel3/BUILD_INFO.txt
            echo "📄 Image 大小: $(du -h "$image_path" | cut -f1)"
          fi
          # 校验 Image 不是 0 字节 / 不是残缺（ccache 命中残留的典型症状）
          if [ -s ./AnyKernel3/Image ]; then
            echo "✅ Image 非空校验通过 ($(stat -c%s ./AnyKernel3/Image) bytes)"
          else
            echo "::error::❌ AnyKernel3/Image 为空或缺失，拒绝打包出假包"; exit 1
          fi

      - name: "🧠 Set Artifact Name | 设置产物名称"
        id: set_name
        run: |
          if [ "${{ github.event.inputs.lz4kd }}" = "On" ]; then
            BASE_NAME="${{ github.event.inputs.FEIL }}_BakaSU_lz4kd_${{ env.KSUVER }}"
          elif [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.1" ]; then
            BASE_NAME="${{ github.event.inputs.FEIL }}_BakaSU_lz4_zstd_${{ env.KSUVER }}"
          elif [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.6" ]; then
            BASE_NAME="${{ github.event.inputs.FEIL }}_BakaSU_lz4_${{ env.KSUVER }}"
          else
            BASE_NAME="${{ github.event.inputs.FEIL }}_BakaSU_${{ env.KSUVER }}"
          fi
          
          # P2-5: 原命名只有 lz4kd/SUSFS 两维，一周后翻 Artifacts 分不清哪个开了 BBG/CVE
          SUFFIX=""
          [ "${{ github.event.inputs.SUSFS }}" = "On" ]        && SUFFIX="${SUFFIX}_SUSFS"
          [ "${{ github.event.inputs.bbg }}" = "On" ]          && SUFFIX="${SUFFIX}_BBG"
          [ "${{ github.event.inputs.bbr }}" = "On" ]           && SUFFIX="${SUFFIX}_BBR"
          [ "${{ github.event.inputs.proxy }}" = "On" ]         && SUFFIX="${SUFFIX}_PROXY"
          [ "${{ github.event.inputs.UNICODE_BYPASS }}" = "On" ] && SUFFIX="${SUFFIX}_UNICODE"
          [ "${{ github.event.inputs.CVE_2026_43499 }}" = "On" ] && SUFFIX="${SUFFIX}_CVE2634"
          [ "${{ github.event.inputs.BAZEL }}" = "On" ]         && SUFFIX="${SUFFIX}_BAZEL"
          FINAL_NAME="${{ github.event.inputs.FEIL }}_BakaSU_${{ env.KSUVER }}_${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}${SUFFIX}"

          echo "ARTIFACT_NAME=${FINAL_NAME}" >> $GITHUB_OUTPUT
          echo "📦 产物名: ${FINAL_NAME}"

      - name: "📤 Upload AnyKernel3 | 上传 AnyKernel3"
        uses: actions/upload-artifact@PINNED_SHA_PLACEHOLDER # v7
        with:
          name: ${{ steps.set_name.outputs.ARTIFACT_NAME }}
          path: |
            ./AnyKernel3/*
            ./BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
         
      # P2-4: find 找不到也 exit 0 → 上个步"绿"，却把失败推给 upload 步（那时你已等完全程）
      # 且 GKI 默认 CONFIG_ZRAM=y 内建，zram.ko 本来就不生成，这两步对多数机型注定红
      - name: "📝 Locate Modules | 定位 zram.ko / crypto_zstdn.ko"
        id: mods
        run: |
          Z=$(find kernel_workspace -name zram.ko -print -quit 2>/dev/null || true)
          ZS=$(find kernel_workspace -name 'crypto_zstdn.ko' -print -quit 2>/dev/null || true)
          if [ -n "$Z" ]; then echo "zram=$Z" >> $GITHUB_OUTPUT; echo "✅ zram.ko: $Z";
          else echo "::warning::zram 为内建(y)，无 zram.ko 属正常，跳过上传"; fi
          if [ -n "$ZS" ]; then echo "zstdn=$ZS" >> $GITHUB_OUTPUT; echo "✅ crypto_zstdn.ko: $ZS";
          else echo "::warning::未生成 crypto_zstdn.ko（lz4kd Off 时正常），跳过上传"; fi

      - name: "📤 Upload zram.ko | 上传 zram.ko (可选)"
        if: ${{ steps.mods.outputs.zram != '' }}
        uses: actions/upload-artifact@PINNED_SHA_PLACEHOLDER # v7
        with:
          name: ${{ github.event.inputs.FEIL }}_zram.ko
          path: ${{ steps.mods.outputs.zram }}
          if-no-files-found: warn
          retention-days: 14   # P2-4: 原无 retention，6机型×3变体×90天两周就撞免费额度
