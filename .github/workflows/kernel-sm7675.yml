name: Build-sm7675
permissions:
  contents: write
  actions: write

on:
  workflow_call: 
    inputs:
      CPU:
        required: true
        type: string
      FEIL:
        required: false
        type: string
      ANDROID_VERSION:
        required: true
        type: string
      KERNEL_VERSION:
        required: true
        type: string
      SUSFS:
        required: true
        type: string
      lz4kd:
        required: true
        type: string
      bbr:
        required: true
        type: string
      bbg:
        required: true
        type: string
      proxy:
        required: true
        type: string
      UNICODE_BYPASS:
        required: true
        type: string

jobs:
  build-kernel-sm7675:
    strategy:
      fail-fast: false
      matrix:
        include:
        - FEIL: 'oneplus_ace_3v_b'
        # - FEIL: 'oneplus_ace_3v_v'
        # - FEIL: 'oneplus_nord_4_b'
        # - FEIL: 'oneplus_nord_4_v'
        
    uses: ./.github/workflows/Call_Build_BakaSU.yml
    secrets: inherit
    with:
      CPU: ${{ inputs.CPU }}
      FEIL: ${{ matrix.FEIL }}
      ANDROID_VERSION: ${{ inputs.ANDROID_VERSION }}
      KERNEL_VERSION: ${{ inputs.KERNEL_VERSION }}
      SUSFS: ${{ inputs.SUSFS }}
      lz4kd: ${{ inputs.lz4kd }}
      bbr: ${{ inputs.bbr }}
      bbg: ${{ inputs.bbg }}
      proxy: ${{ inputs.proxy }}
      UNICODE_BYPASS: ${{ inputs.UNICODE_BYPASS }}