name: Build-sm8750
permissions:
  contents: write
  actions: write
  
on:
  workflow_call: 
    inputs:
      CPU:
        required: true
        type: string
      FEIL:
        required: false
        type: string
      ANDROID_VERSION:
        required: true
        type: string
      KERNEL_VERSION:
        required: true
        type: string
      SUSFS:
        required: true
        type: string
      lz4kd:
        required: true
        type: string
      bbr:
        required: true
        type: string
      bbg:
        required: true
        type: string
      proxy:
        required: true
        type: string
      UNICODE_BYPASS:
        required: true
        type: string
       
jobs:
  build-kernel-sm8750:
    strategy:
      fail-fast: false
      matrix:
        include:
        - FEIL: 'oneplus_13_b'
        # - FEIL: 'oneplus_13s_b'
        # - FEIL:  'oneplus_13t_b'
        # - FEIL:  'oneplus_ace5_pro_b'
        # - FEIL:  'oneplus_ace_6'
        # - FEIL:  'oneplus_pad_2_pro_b'
        # - FEIL:  'oneplus_pad_3_b'
        
    uses: ./.github/workflows/Call_Build_BakaSU.yml
    secrets: inherit
    with:
      CPU: ${{ inputs.CPU }}
      FEIL: ${{ matrix.FEIL }}
      ANDROID_VERSION: ${{ inputs.ANDROID_VERSION }}
      KERNEL_VERSION: ${{ inputs.KERNEL_VERSION }}
      SUSFS: ${{ inputs.SUSFS }}
      lz4kd: ${{ inputs.lz4kd }}
      bbr: ${{ inputs.bbr }}
      bbg: ${{ inputs.bbg }}
      proxy: ${{ inputs.proxy }}
      UNICODE_BYPASS: ${{ inputs.UNICODE_BYPASS }}